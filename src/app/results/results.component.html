<mat-card appearance="outlined">
  <mat-card-header class="center-header">
    <mat-card-title>Results</mat-card-title>
  </mat-card-header>
  <div class="column-headers">
    <span>First Game</span>
    <span>Second Game</span>
    <span>Dealers</span>
  </div>
  <mat-divider></mat-divider>
  <div class="columns">
    <div class="column">
      @for (num of gameOne; track $index; let i = $index) {
        <app-autocomplete-field [number]="num" [control]="data.gameOne[i]" [options]="names"></app-autocomplete-field>
      }
    </div>
    <div class="column">
      @for (num of gameTwo; track $index; let i = $index) {
        <app-autocomplete-field [number]="num" [control]="data.gameTwo[i]" [options]="names"></app-autocomplete-field>
      }
    </div>
    <div class="column">
      @for (control of data.dealers; track $index) {
        <app-autocomplete-field [control]="control" [options]="dealers"></app-autocomplete-field>
      }
    </div>
  </div>
</mat-card>
